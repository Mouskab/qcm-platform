{% extends "base.html" %}
{% block contenu %}
<section>
  <div class="container" style="max-width:720px;">
    <span class="eyebrow">{% if object %}Modifier{% else %}Nouveau{% endif %} QCM</span>
    <h1 class="display-2" style="margin-bottom:32px;">{% if object %}{{ object.titre }}{% else %}Créer un QCM{% endif %}</h1>
    <form method="post" class="dj-form">
      {% csrf_token %}
      {{ form.as_p }}
      <button type="submit" class="btn btn-primary">Enregistrer</button>
      <a href="{% url 'qcm-liste-web' %}" class="btn btn-ghost">Annuler</a>
    </form>
  </div>
</section>
{% endblock %}
