{% extends "base.html" %}
{% block contenu %}
<section>
  <div class="container" style="max-width:560px;">
    <h1 class="display-2">Supprimer « {{ object.titre }} » ?</h1>
    <p class="lede" style="margin:16px 0 28px;">Cette action est irréversible.</p>
    <form method="post">
      {% csrf_token %}
      <button type="submit" class="btn btn-primary" style="background:var(--color-clay)">Confirmer la suppression</button>
      <a href="{% url 'qcm-liste-web' %}" class="btn btn-ghost">Annuler</a>
    </form>
  </div>
</section>
{% endblock %}
