{% extends "base.html" %}
{% block contenu %}
<div class="auth-page">
  <div class="auth-card">
    <span class="eyebrow">Zanse</span>
    <h1>Mot de passe oublié</h1>
    <p class="lede">Indiquez votre adresse e-mail, nous vous enverrons un lien de réinitialisation.</p>
    <form method="post" class="dj-form">
      {% csrf_token %}
      {{ form.as_p }}
      <button type="submit" class="btn btn-primary" style="width:100%; justify-content:center;">Envoyer le lien</button>
    </form>
  </div>
</div>
{% endblock %}
