<!DOCTYPE html>
<html lang="fr">
<head>

    .wrap { max-width: 560px; margin: 0 auto; text-align: center; padding: 100px 20px; }
    .eyebrow { font-family: monospace; font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase; color: #B8452E; }
    h1 { font-size: 2rem; margin: 16px 0; }
    p { color: #2E3E63; margin-bottom: 28px; }
    a { display: inline-block; background: #16233F; color: #FBFAF6; padding: 13px 26px; border-radius: 2px; text-decoration: none; font-weight: 600; }
  </style>
</head>
<body>
  <div class="wrap">
    <span class="eyebrow">Erreur 500</span>
    <h1>Un problème est survenu.</h1>
    <p>Quelque chose s'est mal passé de notre côté. Réessayez dans un instant.</p>

  </div>

</html>
